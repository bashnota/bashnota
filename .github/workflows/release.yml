name: Signed release candidate

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

jobs:
  package:
    name: Verify signed tag and package exact green commit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Require a GitHub-verified annotated tag on master
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="${GITHUB_REF#refs/tags/}"
          node scripts/release/validate-release-version.mjs "${tag_ref#v}"
          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag_ref}")"
          test "$(jq -r '.object.type' <<<"$ref_json")" = tag
          tag_sha="$(jq -r '.object.sha' <<<"$ref_json")"
          tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}")"
          test "$(jq -r '.verification.verified' <<<"$tag_json")" = true
          commit_sha="$(jq -r '.object.sha' <<<"$tag_json")"
          test "$(jq -r '.object.type' <<<"$tag_json")" = commit
          candidate_run_id="$(jq -r '.message | capture("(^|\\n)Release-candidate-run: (?<id>[0-9]+)(\\n|$)").id // empty' <<<"$tag_json")"
          test -n "$candidate_run_id"
          test "$commit_sha" = "$(git rev-parse HEAD)"
          git fetch origin master
          test "$commit_sha" = "$(git rev-parse origin/master)"
          echo "RELEASE_COMMIT=$commit_sha" >> "$GITHUB_ENV"
          echo "CANDIDATE_RUN_ID=$candidate_run_id" >> "$GITHUB_ENV"
      - name: Require successful pre-tag evidence for exact version and commit
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")"
          test "$(jq -r '.path' <<<"$run_json")" = ".github/workflows/release-candidate.yml"
          test "$(jq -r '.event' <<<"$run_json")" = workflow_dispatch
          test "$(jq -r '.head_branch' <<<"$run_json")" = master
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$RELEASE_COMMIT"
          test "$(jq -r '.conclusion' <<<"$run_json")" = success
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/artifacts?name=bashnota-v${version}-pretag-${RELEASE_COMMIT}")"
          test "$(jq -r --arg name "bashnota-v${version}-pretag-${RELEASE_COMMIT}" '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<<"$artifacts")" = 1
      - name: Require successful Quality workflow for exact commit
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${RELEASE_COMMIT}&status=success")"
          quality_run_id="$(jq -r --arg sha "$RELEASE_COMMIT" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success" and .event == "push" and .head_branch == "master")] | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
          test -n "$quality_run_id"
          echo "QUALITY_RUN_ID=$quality_run_id" >> "$GITHUB_ENV"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Recheck release gates
        run: |
          npm audit --omit=dev --audit-level=high
          npm run release:check
      - name: Build archive twice and require reproducibility
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          npm run release:package -- --version "$version" --quality-run-id "$QUALITY_RUN_ID" --release-run-id "$GITHUB_RUN_ID" --output "release/bashnota-${version}.tar.gz"
          npm run release:package -- --version "$version" --quality-run-id "$QUALITY_RUN_ID" --release-run-id "$GITHUB_RUN_ID" --output "/tmp/bashnota-${version}.tar.gz"
          cmp "release/bashnota-${version}.tar.gz" "/tmp/bashnota-${version}.tar.gz"
          (
            cd release
            sha256sum --check "bashnota-${version}.tar.gz.sha256"
          )
      - name: Refuse a tag target superseded during verification
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          test "$RELEASE_COMMIT" = "$(git rev-parse origin/master)"
      - name: Upload verified candidate (publication remains manual)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bashnota-${{ github.ref_name }}-release-candidate
          path: |
            release/*.tar.gz
            release/*.sha256
          if-no-files-found: error
