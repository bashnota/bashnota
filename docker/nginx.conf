map $uri $bashnota_cache_control {
  default "no-cache";
  "~^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(?:css|js|mjs|map|png|jpe?g|gif|svg|webp|avif|woff2?)$" "public, max-age=31536000, immutable";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Cache-Control $bashnota_cache_control always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }

  location ~* ^/(?:sw\.js|registerSW\.js|workbox-[^/]+\.js)$ {
    try_files $uri =404;
  }

  location ~* "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(?:css|js|mjs|map|png|jpe?g|gif|svg|webp|avif|woff2?)$" {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
